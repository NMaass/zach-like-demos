name: materialize rebuild
on:
  push:
    branches: [rebuild/minimal-toolsets]
    paths: [rebuild-source.tar.gz.b64]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/minimal-toolsets
      - name: Replace repository tree from reviewed source archive
        run: |
          base64 -d rebuild-source.tar.gz.b64 > /tmp/rebuild.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name rebuild-source.tar.gz.b64 -exec rm -rf {} +
          tar -xzf /tmp/rebuild.tar.gz -C .
          rm -f rebuild-source.tar.gz.b64
      - name: Commit materialized source
        run: |
          git config user.name "workshop-rebuild-bot"
          git config user.email "workshop-rebuild-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: replace prototypes with minimal-toolset rebuild"
          git push origin HEAD:rebuild/minimal-toolsets
